<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title th:utext="${title}"></title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body>
	<div class="container mt-5">
		<h1 class="mb-4" th:utext="${title} + ' - Generate Your Project'"></h1>
		<form method="post" th:action="@{/api/generate}">
			<div class="mb-3">
				<label for="language" class="form-label">Language</label> <select
					class="form-select" id="language" name="language" required>
					<option value="">Select a language</option>
					<option value="Java">Java</option>
					<option value="NodeJS">NodeJS</option>
					<option value="Python">Python</option>
				</select>
			</div>

			<div class="mb-3">
				<label for="database" class="form-label">Database</label> <select
					class="form-select" id="database" name="database" required>
					<option value="">Select a database</option>
					<option value="PostgreSQL">PostgreSQL</option>
					<option value="MongoDB">MongoDB</option>
				</select>
			</div>

			<button type="submit" class="btn btn-primary">Generate</button>
		</form>
	</div>
</body>
</html>
